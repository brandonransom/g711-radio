<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Server console</title>
<style>
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: #0c0c0c; color: #ccc; font: 13px/1.4 Consolas, Menlo, monospace; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 6px 12px; background: #1b1b1b; border-bottom: 1px solid #333; font-family: system-ui, sans-serif; }
  header strong { color: #fff; }
  #status { color: #e6b800; }
  #status.ok { color: #3fb950; }
  input[type=search] { width: 220px; }
  #issues { background: #151515; border-bottom: 1px solid #333; font-family: system-ui, sans-serif; }
  #issues-toggle { display: block; width: 100%; text-align: left; padding: 6px 12px; background: none; border: 0; color: #ccc; font: inherit; cursor: pointer; }
  #issues-toggle .err { color: #ff6b6b; font-weight: 600; }
  #issues-toggle .warn { color: #e6b800; font-weight: 600; }
  #issues-toggle .ok { color: #3fb950; }
  #issues-list { max-height: 40vh; overflow: auto; padding: 0 12px 8px; }
  .issue { border-left: 4px solid #e6b800; background: #1d1d1d; margin-top: 6px; padding: 6px 10px; }
  .issue.error { border-left-color: #ff6b6b; }
  .issue.inactive { opacity: .55; }
  .issue .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; }
  .issue .sev { font-size: 11px; font-weight: 700; color: #e6b800; }
  .issue.error .sev { color: #ff6b6b; }
  .issue .key { color: #9cdcfe; font-family: Consolas, Menlo, monospace; }
  .issue .meta { color: #888; }
  .issue .hint { margin-top: 4px; color: #ddd; }
  .issue .subjects { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
  .issue button.link { background: none; border: 1px solid #444; border-radius: 3px; color: #9cdcfe; padding: 1px 6px; cursor: pointer; }
  .issue .sample { margin-top: 4px; color: #888; font: 12px/1.3 Consolas, Menlo, monospace; white-space: pre-wrap; word-break: break-all; }
  .issue button { font-size: 12px; }
  #out { flex: 1; margin: 0; padding: 6px 12px; overflow: auto; }
  #out div { white-space: pre-wrap; word-break: break-all; }
  #out .err { color: #ff6b6b; }
  #out .warn { color: #e6b800; }
  #out .note { color: #58a6ff; font-style: italic; }
</style>
</head>
<body data-stream="{{.StreamURL}}">
<header>
  <strong>Server console</strong>
  <span id="status">connecting&hellip;</span>
  <input id="filter" type="search" placeholder="Filter (case-insensitive)">
  <label><input id="follow" type="checkbox" checked> Follow</label>
  <button id="pause" type="button">Pause</button>
  <button id="clear" type="button">Clear</button>
</header>
<div id="issues" hidden>
  <button id="issues-toggle" type="button" aria-expanded="false"></button>
  <div id="issues-list" hidden></div>
</div>
<div id="out" role="log" aria-live="off"></div>
<script nonce="{{.Nonce}}">
(function () {
  var MAX_LINES = 5000, RETRY_MS = 2000;
  var out = document.getElementById('out');
  var status = document.getElementById('status');
  var filter = document.getElementById('filter');
  var follow = document.getElementById('follow');
  var pauseBtn = document.getElementById('pause');
  var issuesBox = document.getElementById('issues');
  var issuesToggle = document.getElementById('issues-toggle');
  var issuesList = document.getElementById('issues-list');
  var base = document.body.dataset.stream;
  var last = 0, paused = false, held = [];
  var issues = [], dismissed = {}, issuesOpen = false, issuesSeen = false;

  function matches(text) {
    var f = filter.value.trim().toLowerCase();
    return !f || text.toLowerCase().indexOf(f) !== -1;
  }

  function addLine(frag, text, cls) {
    var d = document.createElement('div');
    d.textContent = text;
    if (!cls) {
      if (/error|fatal|panic|fail/i.test(text)) cls = 'err';
      else if (/warn/i.test(text)) cls = 'warn';
    }
    if (cls) d.className = cls;
    d.hidden = !matches(text);
    frag.appendChild(d);
  }

  function show(items) {
    var frag = document.createDocumentFragment();
    items.forEach(function (it) { addLine(frag, it.text, it.cls); });
    out.appendChild(frag);
    while (out.childNodes.length > MAX_LINES) out.removeChild(out.firstChild);
    if (follow.checked) out.scrollTop = out.scrollHeight;
  }

  function receive(m) {
    if (m.reset) { out.textContent = ''; held = []; }
    var items = [];
    if (m.missed) items.push({ text: '-- some lines were missed while disconnected --', cls: 'note' });
    m.lines.forEach(function (t) { items.push({ text: t }); });
    if (paused) held = held.concat(items).slice(-MAX_LINES);
    else show(items);
    last = m.next;
  }

  function ago(secs) {
    if (secs < 10) return 'just now';
    if (secs < 90) return secs + 's';
    if (secs < 5400) return Math.round(secs / 60) + 'm';
    if (secs < 129600) return Math.round(secs / 3600) + 'h';
    return Math.round(secs / 86400) + 'd';
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function showInLog(text) {
    filter.value = text;
    filter.dispatchEvent(new Event('input'));
    follow.checked = false;
    var first = Array.prototype.find.call(out.children, function (d) { return !d.hidden; });
    if (first) first.scrollIntoView({ block: 'start' });
  }

  function renderIssues() {
    var visible = issues.filter(function (i) { return !(i.id in dismissed) || i.count > dismissed[i.id]; });
    issuesBox.hidden = issues.length === 0;
    var errors = 0, warns = 0;
    visible.forEach(function (i) {
      if (!i.active) return;
      if (i.severity === 'error') errors++; else warns++;
    });
    issuesToggle.textContent = '';
    issuesToggle.appendChild(el('span', null, (issuesOpen ? '\u25BE ' : '\u25B8 ') + 'Issues: '));
    if (errors + warns === 0) {
      issuesToggle.appendChild(el('span', 'ok', 'no active problems'));
      if (visible.length) issuesToggle.appendChild(el('span', null, ' (' + visible.length + ' earlier)'));
    } else {
      if (errors) issuesToggle.appendChild(el('span', 'err', errors + (errors === 1 ? ' error' : ' errors')));
      if (errors && warns) issuesToggle.appendChild(el('span', null, ', '));
      if (warns) issuesToggle.appendChild(el('span', 'warn', warns + (warns === 1 ? ' warning' : ' warnings')));
    }
    issuesToggle.setAttribute('aria-expanded', issuesOpen ? 'true' : 'false');
    issuesList.hidden = !issuesOpen;
    if (!issuesOpen) return;

    var scrolled = issuesList.scrollTop;
    var frag = document.createDocumentFragment();
    visible.forEach(function (i) {
      var card = el('div', 'issue ' + i.severity + (i.active ? '' : ' inactive'));
      var head = el('div', 'head');
      head.appendChild(el('span', 'sev', i.severity === 'error' ? 'ERROR' : 'WARNING'));
      head.appendChild(el('strong', null, i.title));
      if (i.key) head.appendChild(el('span', 'key', i.key));
      head.appendChild(el('span', 'meta', '\u00D7' + i.count + ' \u00B7 ' + (i.active ? 'last seen ' : 'not seen for ') + ago(i.ago)));
      var showBtn = el('button', null, 'Show in log');
      showBtn.type = 'button';
      showBtn.addEventListener('click', function () { showInLog(i.filter); });
      var dismissBtn = el('button', null, 'Dismiss');
      dismissBtn.type = 'button';
      dismissBtn.title = 'Hide until it happens again';
      dismissBtn.addEventListener('click', function () { dismissed[i.id] = i.count; renderIssues(); });
      head.appendChild(showBtn);
      head.appendChild(dismissBtn);
      card.appendChild(head);
      if (i.hint) card.appendChild(el('div', 'hint', i.hint));
      if (i.subjects && i.subjects.length) {
        var affected = el('div', 'subjects');
        affected.appendChild(el('span', 'meta', 'Affected (' + i.subjectTotal + '):'));
        i.subjects.forEach(function (s) {
          var b = el('button', 'link', s.name + ' \u00D7' + s.count);
          b.type = 'button';
          b.title = 'Show this stream in the log';
          b.addEventListener('click', function () { showInLog(s.name); });
          affected.appendChild(b);
        });
        if (i.subjectTotal > i.subjects.length) {
          affected.appendChild(el('span', 'meta', '+' + (i.subjectTotal - i.subjects.length) + ' more'));
        }
        card.appendChild(affected);
      }
      card.appendChild(el('div', 'sample', i.sample));
      frag.appendChild(card);
    });
    issuesList.textContent = '';
    issuesList.appendChild(frag);
    issuesList.scrollTop = scrolled;
  }

  function receiveIssues(list) {
    issues = list;
    if (!issuesSeen) {
      issuesSeen = true;
      issuesOpen = list.some(function (i) { return i.active; });
    }
    renderIssues();
  }

  function connect() {
    var es = new EventSource(base + '?after=' + last);
    es.onopen = function () { status.textContent = 'live'; status.className = 'ok'; };
    es.onmessage = function (e) { receive(JSON.parse(e.data)); };
    es.addEventListener('issues', function (e) { receiveIssues(JSON.parse(e.data)); });
    es.onerror = function () {
      es.close();
      status.textContent = 'disconnected, retrying\u2026';
      status.className = '';
      setTimeout(connect, RETRY_MS);
    };
  }

  issuesToggle.addEventListener('click', function () { issuesOpen = !issuesOpen; renderIssues(); });
  filter.addEventListener('input', function () {
    Array.prototype.forEach.call(out.children, function (d) { d.hidden = !matches(d.textContent); });
  });
  out.addEventListener('scroll', function () {
    follow.checked = out.scrollHeight - out.scrollTop - out.clientHeight < 40;
  });
  pauseBtn.addEventListener('click', function () {
    paused = !paused;
    pauseBtn.textContent = paused ? 'Resume' : 'Pause';
    if (!paused) { show(held); held = []; }
  });
  document.getElementById('clear').addEventListener('click', function () {
    out.textContent = '';
    held = [];
  });

  connect();
})();
</script>
</body>
</html>
